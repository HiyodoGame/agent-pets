name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: petdeck/package-lock.json
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Install
        working-directory: petdeck
        run: npm ci
      - name: Cache bundled Node
        uses: actions/cache@v4
        with:
          path: petdeck/.cache/node
          key: node-runtime-${{ hashFiles('petdeck/node-runtime.json') }}
      - name: Fetch bundled Node
        working-directory: petdeck
        run: npm run fetch-node
      - name: Verify bundled Node
        working-directory: petdeck
        shell: pwsh
        run: |
          $exe = "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $exe)) { throw "missing bundled node executable" }
          $version = & $exe --version
          if ($version -ne "v24.18.0") { throw "unexpected bundled node version: $version" }
          foreach ($file in @("src-tauri/resources/third-party/nodejs/LICENSE", "src-tauri/resources/third-party/nodejs/THIRD_PARTY_LICENSES")) {
            if (-not (Test-Path $file)) { throw "missing $file" }
          }
      - name: Quality gates
        working-directory: petdeck
        run: |
          npm run typecheck
          npm test
          npm run lint
          npm run build
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: petdeck
          tagName: ${{ github.ref_name }}
          releaseName: PetDeck ${{ github.ref_name }}
          releaseBody: 'See the assets below to download and install PetDeck.'
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
      - name: Verify packaged Node sidecar and installer size
        working-directory: petdeck
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/node.exe"
          if (-not (Test-Path $exe)) { throw "bundled node was not copied into the release output" }
          $version = & $exe --version
          if ($version -ne "v24.18.0") { throw "unexpected packaged node version: $version" }
          Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | ForEach-Object {
            Write-Host ("installer: {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB))
          }
