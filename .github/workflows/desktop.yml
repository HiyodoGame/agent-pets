name: Desktop CI

on:
  push:
    branches: [master]
    paths: ['petdeck/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['petdeck/**', '.github/workflows/desktop.yml']

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: petdeck/package-lock.json
      - name: Install
        working-directory: petdeck
        run: npm ci
      - name: Cache bundled Node
        uses: actions/cache@v4
        with:
          path: petdeck/.cache/node
          key: node-runtime-${{ hashFiles('petdeck/node-runtime.json') }}
      - name: Fetch bundled Node
        working-directory: petdeck
        run: npm run fetch-node
      - name: Verify bundled Node
        working-directory: petdeck
        shell: pwsh
        run: |
          $exe = "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $exe)) { throw "missing bundled node executable" }
          $version = & $exe --version
          if ($version -ne "v24.18.0") { throw "unexpected bundled node version: $version" }
          foreach ($file in @("src-tauri/resources/third-party/nodejs/LICENSE", "src-tauri/resources/third-party/nodejs/THIRD_PARTY_LICENSES")) {
            if (-not (Test-Path $file)) { throw "missing $file" }
          }
      - name: Typecheck
        working-directory: petdeck
        run: npm run typecheck
      - name: Unit tests
        working-directory: petdeck
        run: npm test
      - name: Lint
        working-directory: petdeck
        run: npm run lint
      - name: Web build
        working-directory: petdeck
        run: npm run build
      - name: Rust fmt check
        working-directory: petdeck
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Rust tests
        working-directory: petdeck
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer (unsigned CI smoke)
        working-directory: petdeck
        run: npm run tauri:build -- --bundles nsis --no-sign
      - name: Verify silent NSIS install contents
        working-directory: petdeck
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = 'src-tauri/target/release/node.exe'
          if (-not (Test-Path $node -PathType Leaf)) { throw 'bundled node was not copied into the release output' }
          $version = & $node --version
          if ($version -ne 'v24.18.0') { throw "unexpected packaged node version: $version" }

          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*_x64-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "expected one NSIS installer, found $($installers.Count)" }
          $installDir = Join-Path $env:RUNNER_TEMP 'petdeck-nsis-ci'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "silent NSIS install failed with exit code $($process.ExitCode)" }
          foreach ($relative in @('petdeck.exe', 'node.exe', 'server/bridge.mjs', 'third-party/nodejs/LICENSE', 'third-party/nodejs/THIRD_PARTY_LICENSES')) {
            $path = Join-Path $installDir $relative
            if (-not (Test-Path $path -PathType Leaf)) { throw "installed content is missing: $relative" }
          }
          $installedNodeVersion = & (Join-Path $installDir 'node.exe') --version
          if ($installedNodeVersion -ne 'v24.18.0') { throw "unexpected installed node version: $installedNodeVersion" }
          Write-Host "silent NSIS install content check passed: $installDir"
