name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: petdeck/package-lock.json
      - name: Install
        working-directory: petdeck
        run: npm ci
      - name: Unit tests (node --test, TS type-stripping)
        working-directory: petdeck
        run: npm test
      - name: Build
        working-directory: petdeck
        run: npm run build
      - name: Lint
        working-directory: petdeck
        run: npx oxlint src server